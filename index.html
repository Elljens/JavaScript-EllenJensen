<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub_Home</title>
    <script src="https://kit.fontawesome.com/ec3d7ec6ab.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="CSS/style.css"/>
    <link rel="stylesheet" href="CSS/cart.css"/>
    <script type="module" src="./JS/index.js"></script>
</head>
<body>
    <header>
        <a href="index.html"><img src="gamehub_logo.png" class="logo"> </a>
        <a href="cart.html"><i class="fa-solid fa-basket-shopping fa-2x"></i><span class="cart-count"></span></a>       
    </header>
    
    <main>

        <h1>Welcome to GameHub!</h1>
        <h2>Check out our selection of games:</h2>
        <div class="search-container">
            <p>Search for your favourite game: </p>
            <form id="searchForm">
                <input type="search" id="searchInput" placeholder="Search games"/>
            </form>
        </div>

       
        <div id="container" class="container">
            <p>Loading games...</p>
        </div>
       
    </main>
    <footer>
        <p>2025 GameHUB</p>
    </footer>

</body>
</html>
